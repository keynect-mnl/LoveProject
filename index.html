<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>

<script src="https://kit.fontawesome.com/a14ae32021.js" crossorigin="anonymous"></script>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<title>I Love U Heart</title>

<style type="text/css">
@font-face {
	font-family: digit;
	src: url('digital-7_mono.ttf') format("truetype");
}
</style>

<link href="css/default.css" type="text/css" rel="stylesheet">

<script type="text/javascript" src="js/jquery.js"></script>
<script type="text/javascript" src="js/garden.js"></script>
<script type="text/javascript" src="js/functions.js"></script>

</head>

<body>

<div id="mainDiv">

	<div id="content">

		<div id="loveHeart">

			<canvas id="garden"></canvas>

			<div id="words">

				<div id="messages">

					<span id="names">Loading...</span>

					<div id="elapseClock"></div>

				</div>

				<div id="loveu">
					Loading...
				</div>

			</div>

		</div>

	</div>

</div>


<script type="text/javascript">

/*
 * ============================================================
 * GET ID FROM URL
 * ============================================================
 */

const queryString = window.location.search;
const urlParams = new URLSearchParams(queryString);

const id = urlParams.get('id');

console.log("Love ID:", id);


/*
 * ============================================================
 * LOAD OFFSET VALUES
 *
 * These are global because functions.js uses them.
 * ============================================================
 */

var offsetX = 0;
var offsetY = 0;

$(function() {

	offsetX = $("#loveHeart").width() / 2;
	offsetY = $("#loveHeart").height() / 2 - 55;

});


/*
 * ============================================================
 * BASE64 DECODER
 *
 * Converts Base64 encoded JSON back into normal JSON.
 * Supports UTF-8 characters.
 * ============================================================
 */

function decodeBase64(base64) {

	const binaryString = atob(base64);

	const bytes = new Uint8Array(binaryString.length);

	for (let i = 0; i < binaryString.length; i++) {
		bytes[i] = binaryString.charCodeAt(i);
	}

	return new TextDecoder("utf-8").decode(bytes);

}


/*
 * ============================================================
 * LOAD LOVE DATA
 * ============================================================
 */

if (!id) {

	$("#names").text("Invalid link");

	$("#loveu").html(
		"No love letter ID was provided."
	);

} else {

	fetch("data.json")

		.then(function(response) {

			if (!response.ok) {
				throw new Error("Could not load data.json");
			}

			return response.json();

		})

		.then(function(data) {

			/*
			 * Find encoded data using the ID
			 */

			const encodedData = data[id.toUpperCase()];

			if (!encodedData) {

				throw new Error(
					"Love letter not found"
				);

			}


			/*
			 * Decode Base64
			 */

			const decodedData = decodeBase64(encodedData);


			/*
			 * Convert decoded JSON string
			 * into a JavaScript object
			 */

			const loveData = JSON.parse(decodedData);


			console.log("Love data loaded");


			/*
			 * ====================================================
			 * GET DATA
			 * ====================================================
			 */

			const sender = loveData.sender;
			const receiver = loveData.receiver;
			const date = loveData.date;
			const message = loveData.message;


			/*
			 * ====================================================
			 * DISPLAY NAMES
			 * ====================================================
			 */

			$("#names").text(
				sender + " + " + receiver
			);


			/*
			 * ====================================================
			 * DISPLAY MESSAGE
			 * ====================================================
			 */

			$("#loveu").html(
				message + "<br>From: " + sender
			);


			/*
			 * ====================================================
			 * CONVERT DATE
			 *
			 * YYYY-MM-DD
			 * ====================================================
			 */

			const dateParts = date.split("-");

			const yyyy = parseInt(dateParts[0]);
			const mm = parseInt(dateParts[1]) - 1;
			const dd = parseInt(dateParts[2]);


			/*
			 * ====================================================
			 * RELATIONSHIP DATE
			 * ====================================================
			 */

			var together = new Date();

			together.setFullYear(
				yyyy,
				mm,
				dd
			);

			together.setHours(0);
			together.setMinutes(0);
			together.setSeconds(0);
			together.setMilliseconds(0);


			console.log(
				"Relationship date:",
				together
			);


			/*
			 * ====================================================
			 * CANVAS SUPPORT
			 * ====================================================
			 */

			if (!document.createElement('canvas').getContext) {

				var msg = document.createElement("div");

				msg.id = "errorMsg";

				msg.innerHTML =
					"Your browser doesn't support HTML5!<br/>" +
					"Recommend use Chrome 14+/IE 9+/Firefox 7+/Safari 4+";

				document.body.appendChild(msg);

				$("#code").css(
					"display",
					"none"
				);

				$("#copyright").css(
					"position",
					"absolute"
				);

				$("#copyright").css(
					"bottom",
					"10px"
				);

				document.execCommand("stop");


			} else {

				/*
				 * ====================================================
				 * START HEART
				 * ====================================================
				 */

				setTimeout(function() {

					startHeartAnimation();

				}, 100);


				/*
				 * ====================================================
				 * TIMER
				 * ====================================================
				 */

				timeElapse(together);

				setInterval(function() {

					timeElapse(together);

				}, 500);


				/*
				 * ====================================================
				 * POSITIONING
				 * ====================================================
				 */

				adjustCodePosition();

				$("#code").typewriter();

			}

		})

		.catch(function(error) {

			console.error(
				"Error loading love data:",
				error
			);

			$("#names").text(
				"Something went wrong"
			);

			$("#loveu").html(
				"This love letter could not be found."
			);

		});

}

</script>

</body>
</html>
